<label>Name
  <input name="title" required placeholder="e.g. eBay mixed bulk 4.2kg" value="{{ lot.title if lot else '' }}">
</label>
<div class="row">
  <label>Purchased on
    <input type="date" name="purchased_on" required value="{{ lot.purchased_on if lot else '' }}">
  </label>
  <label>Source
    <select name="source">
      {% for source in sources %}
      <option value="{{ source }}" {% if lot and lot.source == source %}selected{% endif %}>{{ source }}</option>
      {% endfor %}
    </select>
  </label>
</div>
<div class="row">
  <label>Cost
    <input class="money-part" name="cost" inputmode="decimal" placeholder="120.00" required value="{{ money_input(lot.cost_cents) if lot else '' }}">
  </label>
  <label>Shipping
    <input class="money-part" name="shipping" inputmode="decimal" placeholder="15.00" value="{{ money_input(lot.shipping_cents) if lot else '' }}">
  </label>
</div>
<div class="row">
  <label>Tax
    <input class="money-part" name="tax" inputmode="decimal" placeholder="8.40" value="{{ money_input(lot.tax_cents) if lot else '' }}">
  </label>
  <label>Handling
    <input class="money-part" name="handling" inputmode="decimal" placeholder="3.00" value="{{ money_input(lot.handling_cents) if lot else '' }}">
  </label>
</div>
<p class="total-line">Total to recover <strong id="lot-total">$0.00</strong></p>
<label>Notes
  <textarea name="notes" rows="3" placeholder="Seller, weight, what you expected to find">{{ lot.notes if lot else '' }}</textarea>
</label>
<script>
  function parseMoney(value) {
    const raw = (value || "").replace(/[$,]/g, "").trim();
    if (!raw) return 0;
    return Math.round(parseFloat(raw) * 100);
  }
  function formatMoney(cents) {
    const sign = cents < 0 ? "-" : "";
    cents = Math.abs(cents);
    return sign + "$" + Math.floor(cents / 100) + "." + String(cents % 100).padStart(2, "0");
  }
  function updateLotTotal() {
    const parts = document.querySelectorAll(".money-part");
    let total = 0;
    parts.forEach((input) => { total += parseMoney(input.value); });
    document.getElementById("lot-total").textContent = formatMoney(total);
  }
  document.querySelectorAll(".money-part").forEach((input) => {
    input.addEventListener("input", updateLotTotal);
  });
  updateLotTotal();
</script>
