<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lotledger{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('dashboard') }}">Lotledger</a>
    <nav>
      <a href="{{ url_for('dashboard') }}">P&amp;L</a>
      <a href="{{ url_for('lots') }}">Lots</a>
      <a href="{{ url_for('sales') }}">Sales</a>
      <a href="{{ url_for('sales_profit') }}">Profit</a>
      <a href="{{ url_for('settings') }}">Settings</a>
      <a href="{{ url_for('brickowl_lab') }}">BrickOwl lab</a>
      <a href="{{ url_for('bricklink_lab') }}">BrickLink lab</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
